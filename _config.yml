title: ibiseolsin's blog
description: 에이전트를 만들고, 재 보고, 기록합니다
url: "https://ibiseolsin.github.io"
baseurl: "/blog"
theme: minima
minima:
  skin: classic

markdown: kramdown
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - about.md

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
